   <div class="cell"><h3>The upside-downer</h3><button class="btn alt rot" onClick=${p.flip}>${lf}</button></div>
   <div class="cell"><h3>The multiplier</h3><div class="multi">${Array.from({length:cap},(_,i)=>html`<button key=${i} class="btn y" onClick=${()=>setMult(m=>m+2)}>${lm}</button>`)}</div><p class="pix">${mult>=49?'they are multiplying off-screen.':'copies: '+mult}</p></div>
   <div class="cell"><h3>The coward</h3><div id="runbox" ref=${box} onPointerMove=${e=>flee(e.clientX,e.clientY)}><button class="btn g" ref=${rb} onPointerDown=${e=>{if(dodge<=14){e.preventDefault();flee(0,0,true)}}} onClick=${()=>{if(dodge>14){Bus.toast('...you caught me. I am so proud.');Bus.party()}}}>${dodge>14?'...fine.':lr}</button></div><p class="pix">dodges: ${dodge}</p></div>
   <div class="cell"><h3>The unnecessary</h3><button class="btn rot" onClick=${()=>Bus.dramatic()}>${ld}</button></div>
   <div class="cell"><h3>The void button</h3><button class="btn alt" onClick=${()=>{const n=nc+1;setNc(n);Bus.toast(nothingMsg(n))}}>${lo}</button><p class="pix">clicks: ${nc}. effect: none.</p></div>
  </div></section>`}

function DecSec({p}){
 const l=useLabel('dec','MAKE A TERRIBLE DECISION');
 return html`<section class="sec movable s3"><h2 class="big wob">The chaos generator</h2><p class="note">One button. It changes the palette plus a few other things, chosen at random. It will not ask first.</p>
  <button class="btn rot" style=${{fontSize:'clamp(16px,4vw,26px)',padding:'18px 22px'}} onClick=${p.decide}>${l}</button>
  <p class="pix">decisions made: ${p.decisions} · regrets: ${Math.floor(p.decisions*1.5)} <button class="tb" onClick=${p.reset}>RESET CHAOS</button></p></section>`}

function DeskSec(){return html`<section class="sec movable s4"><${Hid} id="h3" e="🪱" s=${{right:'8px',bottom:'8px'}}/><h2 class="big wob">Interactive desktop</h2><p class="note">Drag the windows by their blue title bars. Icons on the left open more of them. One window will not leave.</p><${Desk}/></section>`}

function DoorSec({p}){
 const lf=useRef(null),busy=useRef(false);
 const open=()=>{if(busy.current)return;busy.current=true;Snd.beep(90,.5,'sawtooth',.08);
  gsap.timeline().to(lf.current,{rotationY:-112,duration:.9,ease:'power3.out'}).add(()=>{p.openRoom('door');}).to(lf.current,{rotationY:0,duration:.5,delay:.8,onComplete:()=>{busy.current=false}})};
 return html`<section class="sec movable s1"><${Hid} id="h4" e="🕷️" s=${{left:'10px',top:'10px'}}/><h2 class="big wob">The forbidden room</h2>
  <div class="door-wrap"><div id="door"><div class="frame"></div><button class="leaf" ref=${lf} onClick=${open} aria-label="Open the forbidden door" style=${{transformOrigin:'left center'}}></button></div>
  <p class="note" style=${{flex:'1 1 220px'}}>There is a door. It has a doorknob. Nothing bad has ever happened behind it, and there is nothing bad to see in there.</p></div></section>`}

function CursorSec({p}){
 return html`<section class="sec movable s2"><h2 class="big wob">Cursor experiments</h2>
  <p class="note">Your pointer is a spinning object with a rainbow tail. Sometimes it grows a tiny body and walks. Eight things float around and flee from it. Move over the headings: they flinch.</p>
  <button class=${'btn '+(p.cursorOn?'g':'alt')} id="curtog" onClick=${p.toggleCursor} aria-pressed=${p.cursorOn}>CURSOR EFFECTS: ${p.cursorOn?'ON':'OFF'}</button>
  <p class="pix wob" style=${{fontSize:34}}>touch me. no. the other me.</p></section>`}

function SecretSec({p}){
 const buf=useRef([]),[ok,setOk]=useState(false);
 const gems=[['r','#ff2020','red'],['g','#20d030','green'],['b','#2050ff','blue'],['y','#ffe600','yellow']];
 const hit=k=>{buf.current=[...buf.current,k].slice(-5);Snd.beep({r:262,g:330,b:392,y:523}[k],.15,'triangle',.07);if(buf.current.join('')==='rgbry'){buf.current=[];setOk(true);Bus.party()}};
 const pad=[['↑','ArrowUp'],['↓','ArrowDown'],['←','ArrowLeft'],['→','ArrowRight'],['B','b'],['A','a']];
 return html`<section class="sec movable s3"><${Hid} id="h5" e="🍩" s=${{right:'30%',top:'6px'}}/><h2 class="big wob">Easter eggs (probably)</h2>
  <p class="note">Four gems. They like a particular order. Somebody left a hint in a folder you were told not to open. There is also a famous cheat code, and for phones, a keypad.</p>
  <div class="stack">${gems.map(g=>html`<button key=${g[0]} class="gem" aria-label=${g[2]+' gem'} style=${{background:g[1]}} onClick=${()=>hit(g[0])}></button>`)}<span class="pix">${ok?'the gems approve.':'the gems are waiting.'}</span></div>
  <div class="stack" style=${{marginTop:14}}>${pad.map(k=>html`<button key=${k[1]} class="tb" aria-label=${'key '+k[0]} onClick=${()=>Bus.konamiKey(k[1])}>${k[0]}</button>`)}</div></section>`}

function ScrollSec(){return html`<section class="sec movable s4"><h2 class="big wob">The infinite scroll of nonsense</h2><p class="note">Scroll inside the box. It gets worse the further you go.</p><${Scroller}/></section>`}

function FootSec({p}){return html`<section class="sec movable s1"><${Hid} id="h6" e="🧲" s=${{left:'60%',bottom:'6px'}}/><h2 class="big wob" style=${{fontSize:'clamp(22px,5vw,40px)'}}>You reached the bottom</h2>
 <p class="note">Hidden things found: <b>${p.found.size}/6</b>. ${p.found.size>=6?'All of them. Go outside.':'They are small and they are ashamed.'}</p>
 <p class="pix">© 1998-2026 Nobody · Made with React, GSAP and poor decisions · Best viewed while upside down</p></section>`}

const SECS={hero:Hero,btn:BtnSec,dec:DecSec,desk:DeskSec,door:DoorSec,cur:CursorSec,sec:SecretSec,scr:ScrollSec,foot:FootSec};
const BODY_VARS=['--bg','--bg2','--fg','--a','--b','--c','--disp','--body','--ls','--sk'];
const POPS=['You have won NOTHING!','Your PC has 0 viruses and 9 feelings.','Hot singles in your area: moths.','Update available: v0.0.0 (downgrade)','Click OK to continue being you.','This popup is brought to you by a very small raccoon.'];
const KON=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
function App(){
 const [pi,setPi]=useState(0),[labels,setLabels]=useState({}),[order,setOrder]=useState(['hero','btn','dec','desk','door','cur','sec','scr','foot']),[resetN,setResetN]=useState(0);
 const [cursorOn,setCursorOn]=useState(()=>store.get('cursed-cursor','1')==='1'),[emoji,setEmoji]=useState('🌀'),[sound,setSound]=useState(()=>store.get('cursed-sound','0')==='1');
 const [pops,setPops]=useState([]),[toast,setToast]=useState(null),[sass,setSass]=useState(null),[crash,setCrash]=useState(false),[dram,setDram]=useState(false),[room,setRoom]=useState(null),[found,setFound]=useState(()=>new Set()),[decisions,setDecisions]=useState(0);
 const R_=useRef({}),flipped=useRef(false),logoN=useRef(0),konBuf=useRef([]),clicks=useRef([]),tt=useRef(0),st=useRef(0),partied=useRef(false);
 R_.current={pi,room,crash,dram};
 Snd.on=sound;
 const say=t=>{setSass(t);clearTimeout(st.current);st.current=setTimeout(()=>setSass(null),4600)};
 const tst=t=>{setToast(t);clearTimeout(tt.current);tt.current=setTimeout(()=>setToast(null),3200)};
 const bs=document.body.style;
 const applyPal=p=>Object.entries(p).forEach(([k,v])=>bs.setProperty('--'+k,v));
 const popup=()=>{const id=Math.random();setPops(a=>[...a.slice(-3),{id,x:RI(8,Math.max(10,innerWidth-280)),y:RI(70,Math.max(80,innerHeight-170)),t:pick(POPS)}]);setTimeout(()=>setPops(a=>a.filter(q=>q.id!==id)),9000)};
 const party=()=>{Snd.chord();for(let k=0;k<6;k++)setTimeout(()=>burst(R(40,innerWidth-40),R(80,innerHeight-80),['🎉','✨','🍕','💥','🦆','🌈','👾'],12),k*150);
  gsap.to('#stage',{rotation:'+=360',duration:1.5,ease:'power2.inOut',onComplete:()=>gsap.set('#stage',{rotation:flipped.current?180:0})})};
 const flip=()=>{flipped.current=!flipped.current;gsap.to('#stage',{rotation:flipped.current?180:0,duration:1.1,ease:'back.inOut(1.4)'});tst(flipped.current?'gravity has been negotiated.':'gravity restored. mostly.')};
 const nextPers=()=>{const n=(R_.current.pi+1)%PERS.length;setPi(n);bs.setProperty('--disp',PERS[n].f+',Impact,sans-serif');applyPal(PALS[n+1>5?0:n+1]);tst('PERSONALITY: '+PERS[n].n);say(PERS[n].sass[0])};
 const decide=()=>{const n=decisions+1;setDecisions(n);
  const fx=[['typography',()=>{bs.setProperty('--disp',pick(FONTS)+',Impact,sans-serif');bs.setProperty('--body',pick(BODYF)+',sans-serif');bs.setProperty('--ls',R(-.03,.12).toFixed(3)+'em');bs.setProperty('--sk',RI(-14,14)+'deg')}],
   ['shoved things',()=>gsap.to('.movable',{x:()=>R(-22,22),y:()=>R(-12,12),duration:.7,ease:'elastic.out(1,.4)'})],
   ['new cursor',()=>setEmoji(pick(CURS))],
   ['spun stuff',()=>gsap.to(gsap.utils.shuffle(gsap.utils.toArray('.rot')).slice(0,4),{rotation:()=>R(-200,200),duration:.8,ease:'back.out(2)'})],
   ['popup',popup]];
  const ch=gsap.utils.shuffle(fx).slice(0,2+RI(0,1));applyPal(pick(PALS));ch.forEach(f=>f[1]());Snd.beep(R(100,500),.2,'sawtooth',.06);
  tst('DECISION #'+n+': palette, '+ch.map(f=>f[0]).join(', '))};
 const reset=()=>{BODY_VARS.forEach(v=>bs.removeProperty(v));document.body.classList.remove('k98');gsap.killTweensOf('.movable,.rot,#stage');gsap.set('.movable,.rot,#stage',{clearProps:'all'});
  flipped.current=false;setPi(0);setLabels({});setOrder(['hero','btn','dec','desk','door','cur','sec','scr','foot']);setPops([]);setEmoji('🌀');setDecisions(0);setRoom(null);setCrash(false);setDram(false);setSass(null);setResetN(n=>n+1);tst('chaos reset. you are welcome.')};
 const konamiKey=k=>{konBuf.current=[...konBuf.current,k.length===1?k.toLowerCase():k].slice(-10);
  if(konBuf.current.join()===KON.join()){konBuf.current=[];const on=document.body.classList.toggle('k98');if(on)BODY_VARS.slice(0,6).forEach(v=>bs.removeProperty(v));Snd.chord();tst(on?'SECRET THEME UNLOCKED: C:\\DOS\\HACKERMAN':'secret theme put away.');burst(innerWidth/2,innerHeight/2,['💾','🕹️','⬆️','⬇️'],18)}};
 const onFound=id=>{setFound(s=>{const n=new Set(s);n.add(id);return n});tst('hidden thing found! '+(found.size+1)+'/6');Snd.beep(880,.2,'sine',.08)};
 Bus.toast=tst;Bus.say=say;Bus.popup=popup;Bus.dramatic=()=>{if(!R_.current.dram)setDram(true)};Bus.party=party;Bus.openRoom=setRoom;Bus.flip=flip;Bus.found=onFound;Bus.konamiKey=konamiKey;
 const logo=()=>{logoN.current++;gsap.fromTo('#stage section:first-child button.big',{x:-8},{x:0,duration:.4,ease:'elastic.out(1,.2)'});Snd.beep(200+logoN.current*80,.1);
  if(logoN.current===4)tst('the logo twitched.');if(logoN.current>=7){logoN.current=0;setRoom('logo')}};
 const toggleCursor=()=>{const v=!cursorOn;setCursorOn(v);store.set('cursed-cursor',v?'1':'0')};
 const toggleSound=()=>{const v=!sound;Snd.on=v;setSound(v);store.set('cursed-sound',v?'1':'0');if(v)Snd.beep(660,.15,'triangle',.08)};
 useEffect(()=>{
  const click=e=>{Stats.clicks++;if(e.target.closest&&e.target.closest('button'))Snd.beep(R(180,900),.07);
   const now=Date.now();clicks.current=[...clicks.current.filter(t=>now-t<4000),now];
   if(clicks.current.length>=11){clicks.current=[];say(pick(['STOP TOUCHING EVERYTHING','STOP TOUCHING EVERYTHING','that is enough clicking for one lifetime',...PERS[R_.current.pi].sass]))}};
  const key=e=>{Stats.keys++;konamiKey(e.key)};
  document.addEventListener('click',click);addEventListener('keydown',key);
  const iv=setInterval(()=>{const r=R_.current;if(r.room||r.crash||r.dram||document.hidden)return;
   const k=pick(['label','label','sass','hide','hide','shuffle','crash','sass']);
   if(k==='label'){const ids=gsap.utils.shuffle(Object.keys(ALTS)).slice(0,2),o={};ids.forEach(i=>o[i]=pick(ALTS[i]));setLabels(o);setTimeout(()=>setLabels({}),7000)}
   else if(k==='sass')say(pick(PERS[r.pi].sass));
   else if(k==='hide'){const b=gsap.utils.shuffle(gsap.utils.toArray('.sec .btn,.icon')).slice(0,3);gsap.to(b,{autoAlpha:0,duration:.2});say('where did the buttons go? not my problem.');setTimeout(()=>gsap.to(b,{autoAlpha:1,duration:.3}),3000)}
   else if(k==='shuffle'){setOrder(o=>{const m=o.slice(1,-1),a=RI(0,m.length-1),b=RI(0,m.length-1);[m[a],m[b]]=[m[b],m[a]];return[o[0],...m,o[o.length-1]]});say('I rearranged myself. you are welcome.')}
   else if(k==='crash'&&Math.random()<.45)setCrash(true)},6500);
  return()=>{document.removeEventListener('click',click);removeEventListener('keydown',key);clearInterval(iv)}},[]);
 useEffect(()=>{if(found.size>=6&&!partied.current){partied.current=true;party();say('YOU FOUND EVERYTHING. I am not mad. I am proud.')}},[found]);
 const pe=PERS[pi];
 return html`<${Ctx.Provider} value=${{labels,pers:pe}}>
  <div id="bar"><span class="tag">CURSED.EXE / v98.6</span>
   <button class=${'tb '+(sound?'on':'')} id="sndtog" aria-pressed=${sound} onClick=${toggleSound}>SOUND: ${sound?'ON':'OFF'}</button>
   <button class=${'tb '+(cursorOn?'on':'')} id="curbar" aria-pressed=${cursorOn} onClick=${toggleCursor}>CURSOR FX: ${cursorOn?'ON':'OFF'}</button>
   <button class="tb" id="resetbtn" onClick=${reset}>RESET CHAOS</button></div>
  <main id="stage" key=${resetN}>${order.map(id=>{const C=SECS[id];return html`<${C} key=${id} p=${{pers:pe,logo,nextPers,flip,decide,decisions,reset,cursorOn,toggleCursor,found,openRoom:setRoom}}/>`})}</main>
  <${Fx} enabled=${cursorOn} emoji=${emoji}/>
  ${pops.map(q=>html`<div key=${q.id} class="pop" role="status" style=${{left:q.x,top:q.y}}><div class="tt"><span>Important Message</span></div><div class="bd">${q.t}<br/><button class="tb" onClick=${()=>setPops(a=>a.filter(z=>z.id!==q.id))}>OK</button></div></div>`)}
  ${sass?html`<div id="sass" role="status">${sass}</div>`:null}
  ${toast?html`<div id="toast" role="status">${toast}</div>`:null}
  ${dram?html`<${Dram} done=${()=>setDram(false)}/>`:null}
  ${crash?html`<${Crash} done=${()=>{setCrash(false);tst('recovered. we do not talk about it.')}}/>`:null}
  ${room?html`<${Room} key=${room} kind=${room} onExit=${()=>setRoom(null)}/>`:null}
 <//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
